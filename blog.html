    <style>
        /* Blog Specific Styles */
        .blog-header {
            margin-bottom: 40px;

        .blog-controls {

        }

        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .filter-btn:hover, .filter-btn.active {

            color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .search-box {
            position: relative;
            max-width: 300px;
            width: 100%;
        }

        .search-input {
            width: 100%;

            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 8px;

        .post-card.cat-mind { border-left-color: #a855f7; } /* 💡 心得隨筆 */
        .post-card.cat-game { border-left-color: #f97316; } /* 🎮 遊戲日常 */
        .post-card.cat-bug { border-left-color: #10b981; }  /* 🛠️ Bug 修復 */

            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: var(--text-muted);

        .badge-mind { background: rgba(168, 85, 247, 0.2); border: 1px solid #a855f7; color: #c084fc; }
        .badge-game { background: rgba(249, 115, 22, 0.2); border: 1px solid #f97316; color: #fb923c; }
        .badge-bug { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #34d399; }

        .post-title {
            font-size: 1.6rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .post-content {
            font-size: 1.05rem;
            color: var(--text-main);
            line-height: 1.7;
        }

        .post-content p {
            margin-bottom: 12px;

        .post-content ul, .post-content ol {

        // --- 部落格核心 Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            let allPosts = [...STATIC_POSTS];
            sortPosts();
            renderPosts();

            // 搜尋與篩選功能
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', filterAndRender);

            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filterAndRender();
                });
            });

            // --- 輔助函式 ---
            function sortPosts() {
                allPosts.sort((a, b) => new Date(b.date) - new Date(a.date));
            }

            function filterAndRender() {
                const searchVal = searchInput.value.toLowerCase().trim();
                const activeFilter = document.querySelector('.filter-btn.active').getAttribute('data-category');

                const filtered = allPosts.filter(post => {
                    const matchCategory = (activeFilter === 'all' || post.category === activeFilter);
                    const matchSearch = (
                        post.title.toLowerCase().includes(searchVal) ||
                        post.content.toLowerCase().includes(searchVal)
                    );
                    return matchCategory && matchSearch;
                });

                renderFilteredPosts(filtered);
            }

            function renderPosts() {
                renderFilteredPosts(allPosts);
            }

            function renderFilteredPosts(postsToRender) {
                const container = document.getElementById('post-list');
                container.innerHTML = '';

                if (postsToRender.length === 0) {
                    container.innerHTML = `
                        <div class="no-posts">
                            <p>🔍 找不到相符的文章。</p>
                        </div>
                    `;
                    return;
                }

                postsToRender.forEach(post => {
                    const card = document.createElement('article');
                    card.className = `post-card glass-panel cat-${post.category}`;
                    
                    const catNames = {
                        update: '📢 網站更新',
                        mind: '💡 心得隨筆',
                        game: '🎮 遊戲日常',
                        bug: '🛠️ Bug 修復'
                    };

                    const badgeClass = `badge-${post.category}`;
                    const formattedContent = parseMarkdown(post.content);

                    card.innerHTML = `
                        <div class="post-meta">
                            <span class="post-category-badge ${badgeClass}">${catNames[post.category] || post.category}</span>
                            <time datetime="${post.date}">📅 ${post.date}</time>
                        </div>
                        <h2 class="post-title text-gradient">${escapeHtml(post.title)}</h2>
                        <div class="post-content">
                            ${formattedContent}
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            // Line-based Markdown 轉換器
            function parseMarkdown(text) {
                if (!text) return '';
                
                const lines = text.split('\n');
                let inList = false;
                let result = [];

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();

                    if (line.startsWith('- ')) {
                        if (!inList) {
                            result.push('<ul style="margin-left: 20px; margin-bottom: 15px; list-style-type: disc;">');
                            inList = true;
                        }
                        const content = line.substring(2);
                        result.push(`<li style="margin-bottom: 5px;">${parseInlineMarkdown(escapeHtml(content))}</li>`);
                    } else {
                        if (inList) {
                            result.push('</ul>');
                            inList = false;
                        }
                        
                        if (line === '') {
                            result.push('<div style="height: 12px;"></div>');
                        } else {
                            result.push(`<p style="margin-bottom: 12px; line-height: 1.7;">${parseInlineMarkdown(escapeHtml(line))}</p>`);
                        }
                    }
                }
                
                if (inList) {
                    result.push('</ul>');
                }

                return result.join('\n');
            }

            function parseInlineMarkdown(text) {
                // 處理粗體 **text**
                text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                // 處理斜體 *text*
                text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
                // 處理行內 code `code`
                text = text.replace(/`(.*?)`/g, '<code>$1</code>');
                // 處理超連結 [text](url)
                text = text.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
                return text;
            }

            function escapeHtml(string) {
                return String(string).replace(/[&<>"']/g, function (s) {
                    return {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    }[s];
                });
            }
        });
    </script>
